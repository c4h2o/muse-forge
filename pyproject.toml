[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-forge"
version = "0.1.0"
description = "An open-source stand-in for Meta's Muse gadget service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=42",
    "aiohttp>=3.9",
    "websockets>=12",
]

[project.scripts]
muse-forge = "muse_forge.__main__:main"

[tool.setuptools.packages.find]
where = ["server"]
